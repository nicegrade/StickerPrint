<!--
  ============================================================
  popup.html - Интерфейс расширения
  ============================================================
-->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StickerPrint</title>
  <style>
    /* ---- CSS Переменные (тема) ---- */
    :root {
      --bg: #020617;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #eab308;
    }

    /* ---- Сброс стилей ---- */
    * { box-sizing: border-box; }
    body {
      width: 320px;
      min-height: 380px;
      margin: 0;
      padding: 18px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(145deg, #0f172a, #020617);
      color: var(--text);
    }

    /* ---- Контейнер ---- */
    .container {
      background: rgba(30, 41, 59, .9);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 15px 35px rgba(0,0,0,.4);
      border: 1px solid rgba(255,255,255,.08);
    }

    /* ---- Шапка ---- */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
    }
    .title { font-size: 18px; font-weight: 700; }
    .subtitle {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }

    /* ---- Поле ввода ---- */
    .label {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.1);
      background: #0f172a;
      color: white;
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: var(--primary); }
    input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ---- Кнопка ---- */
    button {
      margin-top: 12px;
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: .2s;
    }
    button:hover { transform: translateY(-1px); }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    button.secondary {
      background: linear-gradient(135deg, #334155, #1e293b);
      border: 1px solid rgba(255,255,255,.08);
    }
    button.danger {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
    }

    /* ---- Статус сервера ---- */
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(255,255,255,.04);
    }
    .status-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 7px;
      background: #64748b;
    }
    .dot.online {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }
    .dot.offline {
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
    }

    /* ---- Сообщения о статусе печати ---- */
    .status-message {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12px;
      display: none;
      word-wrap: break-word;
      line-height: 1.4;
      white-space: pre-line;
    }
    .status-message.success {
      display: block;
      background: rgba(34,197,94,0.15);
      color: var(--green);
      border: 1px solid rgba(34,197,94,0.2);
    }
    .status-message.error {
      display: block;
      background: rgba(239,68,68,0.15);
      color: var(--red);
      border: 1px solid rgba(239,68,68,0.2);
    }
    .status-message.info {
      display: block;
      background: rgba(59,130,246,0.15);
      color: var(--primary);
      border: 1px solid rgba(59,130,246,0.2);
    }
    .status-message.warning {
      display: block;
      background: rgba(234,179,8,0.15);
      color: var(--yellow);
      border: 1px solid rgba(234,179,8,0.2);
    }

    /* ---- Последняя печать ---- */
    .last {
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(255,255,255,.04);
      font-size: 13px;
    }
    .last-value {
      margin-top: 5px;
      font-size: 20px;
      font-weight: 700;
      color: #60a5fa;
    }

    /* ---- Серийная печать / прогресс ---- */
    .hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.4;
    }
    .progress-bar {
      margin-top: 10px;
      height: 6px;
      border-radius: 4px;
      background: rgba(255,255,255,.08);
      overflow: hidden;
      display: none;
    }
    .progress-bar.active { display: block; }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #06b6d4);
      transition: width .2s ease;
    }
    #cancelButton { display: none; }

    /* ---- Подвал ---- */
    .footer {
      margin-top: 14px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Шапка -->
    <div class="header">
      <div class="logo">🖨️</div>
      <div>
        <div class="title">StickerPrint</div>
        <div class="subtitle">Автопечать ячеек OZON PVZ</div>
      </div>
    </div>

    <!-- Поле ввода -->
    <div class="label">Номер ячейки или диапазон</div>
    <input id="cellInput" placeholder="напр. 105, П15-П20, 100-105">
    <div class="hint">Диапазоны через тире (можно с литерой: П15-П20), значения — через запятую</div>

    <!-- Кнопки -->
    <button id="printButton">Напечатать</button>
    <button id="cancelButton" class="danger">Отменить печать</button>

    <!-- Прогресс -->
    <div id="progressBar" class="progress-bar">
      <div id="progressBarFill" class="progress-bar-fill"></div>
    </div>

    <!-- Статус -->
    <div class="status">
      <div class="status-line">
        <span>
          <span id="serverDot" class="dot"></span>
          Сервер печати
        </span>
        <span id="serverStatus">проверка...</span>
      </div>
      <div id="statusMessage" class="status-message"></div>
    </div>

    <!-- Последняя печать -->
    <div class="last">
      <div>Последняя печать</div>
      <div id="lastCell" class="last-value">—</div>
    </div>

    <!-- Подвал -->
    <div class="footer">Enter — быстрая печать. Печать продолжается, даже если окно закрыто</div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
